<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purpleberg Terminal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%237c3aed'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Paint the saved theme before the bundle loads so a light-theme user
      // does not see a black flash. Mirrors src/theme/applyTheme.js (added in
      // Task 5); until the settings store exists it also honours the old
      // purpleberg_theme key.
      try {
        var s = JSON.parse(localStorage.getItem("purpleberg.settings") || "{}");
        var theme = s.theme || localStorage.getItem("purpleberg_theme") || "dark";
        var dark = theme === "light" ? false
          : theme === "system" ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : true;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.density = s.density === "comfortable" ? "comfortable" : "compact";
      } catch (e) {}
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #000; }
      html[data-theme="light"] { background: #f4f4f1; }
      body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
